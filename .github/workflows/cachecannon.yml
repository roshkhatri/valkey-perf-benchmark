name: Cachecannon Benchmark Test

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential curl
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install cachecannon
      run: |
        curl -fsSL https://cachecannon.cc/install.sh | sudo bash
        cachecannon --version

    - name: Run cachecannon benchmark test
      run: |
        python benchmark.py \
          --config configs/benchmark-cachecannon-test.json \
          --benchmark-tool cachecannon

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: cachecannon-benchmark-results
        path: results/
